name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build prototype
        run: npm run build --workspace frontend
        env:
          VITE_BASE_PATH: /ax-sales-navigator/
          VITE_ANALYSIS_PROVIDER: ${{ vars.ANALYSIS_API_BASE_URL != '' && 'openai' || 'mock' }}
          VITE_ANALYSIS_API_BASE_URL: ${{ vars.ANALYSIS_API_BASE_URL }}
          VITE_TRANSCRIPTION_PROVIDER: ${{ vars.TRANSCRIPTION_API_BASE_URL != '' && 'google' || 'mock' }}
          VITE_TRANSCRIPTION_API_BASE_URL: ${{ vars.TRANSCRIPTION_API_BASE_URL }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
